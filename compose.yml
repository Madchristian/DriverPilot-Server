# DriverPilot Ferndiagnose-Server auf rpi4-400 (10.0.30.3).
#
# API    :8140  <- TrueNAS-Traefik (10.0.30.20) fuer https://driverpilot.cstrube.de (Cloudflare, Origin-Lock)
# Admin  :8141  <- Pi-Traefik dns-prod-2 (10.0.30.5), Authentik-SSO, https://driverpilot.dns-prod-2.local.cstrube.de
# Beide Ports sind nur im LAN erreichbar (kein Port-Forward auf .3). Identitaets- und
# Forwarded-Header werden nur von den in .env genannten Proxys akzeptiert.
#
# Daten (SQLite) liegen in ./data (0700, uid 10001). Bewusst NICHT in den allgemeinen
# Pi-Backups (siehe README, Abschnitt Datenschutz).
name: driverpilot-server
services:
  server:
    build: .
    image: driverpilot-server:local
    container_name: driverpilot-server
    restart: always
    env_file: .env
    environment:
      TZ: Europe/Berlin
    ports:
      - "8140:8140"
      - "8141:8141"
    volumes:
      - ./data:/data
      # Release-Dateien des Windows-Clients; der Release-Sync (Webhook) schreibt hierhin.
      # Verzeichnis gehoert 10001:1000 mit 775, damit auch deploy/publish-release.sh (christian) darf.
      - ./downloads:/downloads
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
