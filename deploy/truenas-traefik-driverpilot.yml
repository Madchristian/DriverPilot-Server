# Ziel: TrueNAS /mnt/FastStorage/docker/stacks/traefik/dynamic/driverpilot.yml
# driverpilot.cstrube.de auf rpi4-400, zwei Dienste:
#   - Python (10.0.30.3:8140): Client-API /api/*, Webhooks /hooks/*, Release-Dateien /downloads/<datei>, /readyz
#   - SvelteKit (10.0.30.3:8142): alles andere (Start, Anleitung, Downloads-Seite, Datenschutz, Einladung)
# Nur ueber Cloudflare (Origin-Lock B-010, Middleware cloudflare-only). Die Admin-Oberflaeche (/admin)
# lehnt Anfragen von hier ab (Peer 10.0.30.20 ist kein Admin-Proxy); sie haengt am Pi-Traefik.
http:
  routers:
    driverpilot-api:
      rule: Host(`driverpilot.cstrube.de`) && (PathPrefix(`/api/`) || PathPrefix(`/hooks/`) || PathRegexp(`^/downloads/.+`) || Path(`/readyz`))
      priority: 100
      service: driverpilot-api
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      middlewares:
        - cloudflare-only
        - crowdsec-bouncer
        - security-headers
        - rate-limit-public
        - forwarded-https
    driverpilot:
      rule: Host(`driverpilot.cstrube.de`)
      priority: 10
      service: driverpilot-web
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      middlewares:
        - cloudflare-only
        - crowdsec-bouncer
        - security-headers
        - rate-limit-public
        - forwarded-https
  services:
    driverpilot-api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://10.0.30.3:8140
    driverpilot-web:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://10.0.30.3:8142
