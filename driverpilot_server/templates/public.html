<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{ title }} · DriverPilot</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1b; --bg: #fafafa; --muted: #666; --line: #d8d8d8; --accent: #1f6feb; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e6; --bg: #121212; --muted: #9a9a9a; --line: #333; --accent: #6ea8fe; --card: #1c1c1c; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header strong { font-size: 17px; }
  header nav a { margin-right: 14px; color: var(--accent); text-decoration: none; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 26px; margin: 12px 0 14px; } h2 { font-size: 20px; margin: 28px 0 8px; } h3 { font-size: 17px; margin: 20px 0 6px; }
  p, li { max-width: 72ch; }
  a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; word-break: break-all; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; }
  pre code { border: 0; padding: 0; }
  .muted { color: var(--muted); }
  footer { max-width: 860px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <strong>DriverPilot</strong>
  <nav><a href="/">Start</a><a href="/anleitung">Anleitung</a><a href="/downloads/">Downloads</a><a href="/datenschutz">Datenschutz</a></nav>
</header>
<main>
{{ body | safe }}
</main>
<footer>Privater Dienst von Christian Strube für Freunde. Keine öffentliche Registrierung.</footer>
</body>
</html>
