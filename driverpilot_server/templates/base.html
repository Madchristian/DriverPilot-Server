<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}DriverPilot Ferndiagnose{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1b; --bg: #fafafa; --muted: #666; --line: #d8d8d8; --accent: #1f6feb; --warn: #b54708; --ok: #1a7f37; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e6; --bg: #121212; --muted: #9a9a9a; --line: #333; --accent: #6ea8fe; --warn: #f0a35c; --ok: #5fcf7a; --card: #1c1c1c; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header strong { font-size: 17px; }
  header nav a { margin-right: 14px; color: var(--accent); text-decoration: none; }
  header .user { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 12px; } h2 { font-size: 17px; margin: 22px 0 8px; } h3 { font-size: 15px; margin: 14px 0 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; } .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 140px; }
  .kpi b { display: block; font-size: 22px; } .kpi span { color: var(--muted); font-size: 13px; }
  .flash { padding: 10px 14px; border-radius: 8px; margin: 10px 0; border: 1px solid var(--ok); color: var(--ok); }
  .flash.err { border-color: var(--warn); color: var(--warn); }
  .status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
  .status.released { border-color: var(--ok); color: var(--ok); } .status.analysis_failed { border-color: var(--warn); color: var(--warn); }
  .status.awaiting_review { border-color: var(--accent); color: var(--accent); }
  code, pre { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  textarea { width: 100%; min-height: 420px; font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  input[type=text], input[type=number] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); } button.danger { border-color: var(--warn); color: var(--warn); }
  form.inline { display: inline; } .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .muted { color: var(--muted); } .warn { color: var(--warn); } .ok { color: var(--ok); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  details summary { cursor: pointer; color: var(--accent); }
  .freitext { white-space: pre-wrap; word-break: break-word; }
  ul.problems { margin: 6px 0; padding-left: 20px; color: var(--warn); }
</style>
</head>
<body>
<header>
  <strong>DriverPilot Ferndiagnose</strong>
  <nav><a href="/">Fälle</a><a href="/invitations">Einladungen</a><a href="/clients">Zugänge</a><a href="/audit">Audit</a><a href="/codex">KI (ChatGPT)</a><a href="/releases">Releases</a></nav>
  <span class="user">{{ user }} · Server-UTC {{ now }} · Adapter: {{ settings.ai_provider }}</span>
</header>
<main>
{% if flash %}<div class="flash{% if flash.startswith('Fehler') %} err{% endif %}">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
